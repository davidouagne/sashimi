name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions by default; each job raises only what it needs (ADR-0003).
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ktlint (style) + detekt (static analysis). No separate typecheck job:
      # the Kotlin compiler is the type checker, and every other job compiles.
      - name: ktlint + detekt
        run: ./gradlew ktlintCheck detekt --console=plain

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no token needed
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The real coverage gate is jacocoTestCoverageVerification (build.gradle.kts);
      # Codecov is informational only (codecov.yml).
      - name: Tests + coverage gate
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --console=plain

      - name: Coverage summary
        if: always()
        run: |
          report=build/reports/jacoco/test/jacocoTestReport.xml
          if [ -f "$report" ]; then
            line=$(grep -o 'type="LINE" missed="[0-9]*" covered="[0-9]*"' "$report" | tail -1)
            missed=$(echo "$line" | grep -o 'missed="[0-9]*"' | grep -o '[0-9]*')
            covered=$(echo "$line" | grep -o 'covered="[0-9]*"' | grep -o '[0-9]*')
            total=$((missed + covered))
            pct=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f", (t > 0) ? (c / t * 100) : 0 }')
            echo "### Coverage: ${pct}% lines (${covered}/${total})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the runner jar
        run: ./gradlew quarkusBuild --console=plain

      - name: Smoke CLI (--version + --help)
        run: |
          # --version must report the gradle.properties version (single source of truth).
          version=$(sed -n 's/^version=//p' gradle.properties)
          java -jar build/*-runner.jar --version | grep -Fx "$version"
          java -jar build/*-runner.jar --help

      - name: Smoke transcription (one fixture DDL)
        run: |
          out=$(mktemp -d)
          java -jar build/*-runner.jar transcribe \
            -i src/test/resources/fixtures/encounter/input.sql \
            -o "$out"
          # Fails if the packaged jar produced no FSH output.
          ls "$out"/*.fsh
          test -s "$(ls "$out"/*.fsh | head -1)"

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    permissions: {}
    steps:
      - name: Require all jobs to have succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
